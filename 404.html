<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>2026 청산고등학교 2학년 수학여행</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#1B2A4A; color:#fff; font-family:"Noto Sans KR", sans-serif; text-align:center; padding:16px; }
  a{ display:inline-block; margin:6px; padding:12px 18px; border-radius:12px; background:#FF5A36; color:#fff;
     text-decoration:none; font-weight:700; }
  p{ opacity:.8; font-size:14px; }
</style>
<script>
// 잘못된 주소(오타, 주소 끝에 붙은 괄호 등)로 들어오면 앱 첫 화면으로 보내줍니다.
// 주소에 "teacher"가 들어 있으면 선생님용 화면으로 보냅니다.
// (GitHub 주소는 /japanchonsan/ 폴더 아래, Firebase 주소는 맨 앞에 앱이 있습니다)
(function(){
  var base = /github\.io$/.test(location.hostname) ? "/japanchonsan/" : "/";
  var target = base + (/teacher/i.test(location.pathname) ? "teacher.html" : "");
  location.replace(target);
})();
</script>
</head>
<body>
  <div>
    <h2>수학여행 앱으로 이동하는 중이에요...</h2>
    <p>자동으로 넘어가지 않으면 아래 버튼을 눌러주세요.</p>
    <a href="/">학생용</a>
    <a href="/teacher.html">선생님용</a>
  </div>
</body>
</html>
