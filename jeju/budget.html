<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F5F2EC">
<title>예산 · 가쓸신제</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="budget.css">
<script>
try {
  var t = JSON.parse(localStorage.getItem("gsj.theme") || '"auto"');
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  if (JSON.parse(localStorage.getItem("gsj.big") || "false")) document.documentElement.setAttribute("data-big", "");
} catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>가쓸신제</span></a>
  <b>예산</b>
  <button class="btn sm ghost" id="logout" hidden>로그아웃</button>
</header>
<main id="main"><p class="boot">불러오는 중…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/budget.js"></script>
</body>
</html>
