<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F5F2EC">
<meta name="description" content="가쓸신제 — 가보면 쓸모있고 신비한 즐거운 제주도 캠프 학생용 안내">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가쓸신제">
<title>가쓸신제 · 제주 캠프</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  // 화면 설정(다크 모드·큰 글자)을 그리기 전에 먼저 적용해 깜빡임을 막습니다.
  try {
    var t = JSON.parse(localStorage.getItem("gsj.theme") || '"auto"');
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    if (JSON.parse(localStorage.getItem("gsj.big") || "false")) document.documentElement.setAttribute("data-big", "");
  } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" type="button" aria-label="가쓸신제 오늘 화면">
    <img src="icons/icon-192.png" alt="" width="30" height="30">
    <span class="brand-text"><span>가쓸신제</span><small id="brand-sub">제주 캠프</small></span>
  </button>
  <div class="top-right">
    <span class="net" id="net" aria-live="polite"></span>
    <span class="clock" id="clock" aria-label="한국 시간"></span>
  </div>
</header>
<div class="sim" id="sim" hidden></div>
<main id="main" tabindex="-1"><p class="boot">불러오는 중…</p></main>
<nav class="tabs" id="tabs" aria-label="메뉴"></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">이 앱은 자바스크립트가 필요해요. 크롬·사파리·삼성 인터넷으로 열어 주세요.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
